dataset: mindsmall
data_path: data/processed/
benchmark_filename: ['train', 'valid', 'test']
model: BPR
embedding_size: 64
epochs: 100
train_batch_size: 2048
learner: adam
learning_rate: 0.001
weight_decay: 0.0
eval_step: 5
stopping_step: 15
train_neg_sample_args:
  distribution: popularity
  sample_num: 1
  alpha: 1.0
eval_args:
  group_by: user
  order: RO
  mode:
    valid: full
    test: full
metrics: ['Recall', 'NDCG', 'MRR']
topk: [10, 20, 50]
valid_metric: Recall@20
