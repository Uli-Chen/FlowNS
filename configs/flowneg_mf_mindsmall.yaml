dataset: mindsmall
data_path: data/processed/
benchmark_filename: ['train', 'valid', 'test']
model: BPR
embedding_size: 64
epochs: 100
train_batch_size: 2048
eval_batch_size: 4096000
learner: adam
learning_rate: 0.001
weight_decay: 0.0
eval_step: 5
stopping_step: 15
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
eval_args:
  group_by: user
  order: RO
  mode:
    valid: full
    test: full
metrics: ['Recall', 'NDCG', 'MRR']
topk: [10, 20, 50]
valid_metric: Recall@20
flowneg:
  warm_up_epochs: 5
  velocity_hidden_mult: 4
  velocity_layers: 2
  cfm_lr: 0.001
  cfm_batch_size: 1024
  cfm_epochs_per_update: 5
  cfm_train_steps: 200
  faiss_M: 50
  faiss_rebuild_every: 5
  faiss_metric: IP
  tau_h: 0.5
  tau_h_schedule: constant
  ode_steps: 4
  n_flow_samples: 1
  exposure_cache_path: exposure_cache/mindsmall_exposure_negs.pkl
