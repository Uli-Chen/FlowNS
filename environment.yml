# FlowNeg Conda Environment
# Usage: conda env create -f environment.yml
# Activate: conda activate flowneg

name: flowneg
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip

  # PyTorch (CUDA 12.4)
  - pytorch>=2.0
  - pytorch-cuda=12.4

  # Scientific
  - numpy>=1.24,<2.0
  - scipy>=1.10
  - scikit-learn>=1.2
  - pandas>=1.5

  # FAISS (conda-forge has GPU build)
  - faiss-cpu>=1.7

  # Pip-only packages
  - pip:
    - recbole>=1.2.0
    - tqdm>=4.60
    - colorlog>=4.7
    - colorama>=0.4.4
    - tensorboard>=2.10
    - texttable>=1.6
    - pyyaml>=6.0
