[project]
name = "flowns"
version = "0.1.0"
description = "Minimal general and sequential recommender training with uv and wandb."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
]

[project.scripts]
flowns = "flowns.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
